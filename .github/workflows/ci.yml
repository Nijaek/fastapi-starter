name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.4.4 mypy==1.10.0 types-passlib==1.7.7.20240327 pydantic==2.7.0 pydantic-settings==2.3.0
      - name: Run Ruff linter
        run: ruff check app tests
      - name: Run Ruff formatter check
        run: ruff format --check app tests
      - name: Run mypy type checker
        run: mypy app

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v --cov=app --cov-fail-under=70 --cov-report=term-missing tests/
